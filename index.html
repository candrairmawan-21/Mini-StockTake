<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Stock Take</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 6px; }
        h1, h2, h3 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        input.qty-input { width: 80px; padding: 5px; text-align: center; }
        .variance-negative { color: red; font-weight: bold; }
        .variance-positive { color: green; font-weight: bold; }
        .header-info { display: flex; justify-content: space-between; background: #e8f4f8; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mini Stock Take System</h1>

    <div id="loginSection" class="section">
        <h2>Login Pengguna</h2>
        <div class="form-group">
            <label for="userIdInput">User ID</label>
            <input type="text" id="userIdInput" placeholder="Masukkan User ID (Contoh: XGSS, XBDS)">
        </div>
        <button id="btnLogin">Masuk</button>
        <p id="loginError" style="color:red; display:none;">User ID tidak valid!</p>
    </div>

    <div id="workspaceSection" class="section hidden">
        <div class="header-info">
            <div><strong>Toko:</strong> <span id="displayStoreCode">-</span></div>
            <div><strong>User ID:</strong> <span id="displayUserId">-</span></div>
            <button id="btnLogout" style="padding: 5px 10px; background-color: #e74c3c;">Logout</button>
        </div>

        <h3>1. Persiapan Data</h3>
        <div class="form-group">
            <label for="mainDbFile">Upload Database Utama (.txt)</label>
            <input type="file" id="mainDbFile" accept=".txt">
        </div>
        <div class="form-group">
            <label for="scanFile">Upload Data Scan (.txt / .csv)</label>
            <input type="file" id="scanFile" accept=".txt,.csv">
        </div>
        
        <div id="rackInfo" class="header-info hidden" style="background: #fff3cd; margin-top: 20px;">
            <div style="font-size: 1.2em;"><strong>Rack Number:</strong> <span id="displayRack">-</span></div>
        </div>

        <h3>2. Tabel Pengecekan Fisik</h3>
        <table id="stockTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>SKU Code</th>
                    <th>Description</th>
                    <th>Qty System</th>
                    <th>Qty Fisik</th>
                    <th>Variance</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center;">Belum ada data diunggah</td></tr>
            </tbody>
        </table>

        <div style="margin-top: 20px; text-align: right;">
            <button id="btnSaveToCloud" class="btn-success hidden">Simpan ke Spreadsheet</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
